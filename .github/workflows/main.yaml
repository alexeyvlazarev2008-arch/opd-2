name: Unity Build CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  checks: write
  contents: read

jobs:
  buildForWindows:
    name: Build for Windows
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код из репозитория
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 2. Кэшируем библиотеку для ускорения последующих сборок
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64
          restore-keys: Library-

      # 3. Собираем проект с помощью GameCI
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: TopDownGame
          allowDirtyBuild: true # Разрешаем сборку, даже если есть мелкие предупреждения
          
      # 4. Сохраняем собранный билд как артефакт
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build/StandaloneWindows64